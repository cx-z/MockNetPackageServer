<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MockNetPack · 设备</title>
<link rel="stylesheet" href="style.css">
<!-- M8.6 编辑表单 JSON 折叠编辑器（vendored CodeMirror 5.65.18，同源加载，见 lib/codemirror/README.md） -->
<link rel="stylesheet" href="lib/codemirror/lib/codemirror.min.css">
<link rel="stylesheet" href="lib/codemirror/addon/fold/foldgutter.min.css">
</head>
<body>
<!-- M7.1.2 登录门禁：未登录仅显示登录/注册视图，主界面登录后显示 -->
<div id="authView" class="auth-wrap hidden">
  <div class="auth-card">
    <h2>MockNetPack</h2>
    <span class="sub">登录后管理设备、抓包与 Mock 规则</span>
    <div id="authError" class="auth-error hidden"></div>

    <form id="loginForm">
      <input id="loginUser" class="auth-input" placeholder="用户名" autocomplete="username" required>
      <input id="loginPass" class="auth-input" type="password" placeholder="密码" autocomplete="current-password" required>
      <button type="submit" class="auth-btn">登录</button>
    </form>
    <div id="switchToRegister" class="auth-switch">还没有账号？<button id="toRegister" class="link-btn" type="button">注册</button></div>

    <form id="registerForm" class="hidden">
      <input id="regUser" class="auth-input" placeholder="用户名（1-64 字符，不含空格）" autocomplete="username" required>
      <input id="regPass" class="auth-input" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password" required>
      <input id="regPass2" class="auth-input" type="password" placeholder="确认密码" autocomplete="new-password" required>
      <button type="submit" class="auth-btn">注册并登录</button>
    </form>
    <div id="switchToLogin" class="auth-switch hidden">已有账号？<button id="toLogin" class="link-btn" type="button">返回登录</button></div>
  </div>
</div>

<!-- M8.5: 分享只读视图（免登录） -->
<div id="shareView" class="hidden" style="max-width:900px;margin:0 auto;padding:24px;">
  <div id="shareContent"></div>
</div>

<div class="wrap hidden" id="appWrap">
  <header>
    <button id="backBtn" class="ghost small hidden">← 返回设备列表</button>
    <span class="sub" id="detailApp" class="hidden"></span>
    <h1 id="mainTitle">MockNetPack · 设备</h1>
    <span class="sub" id="apiInfo">连接中…</span>
    <span class="sub" id="userInfo"></span>
    <button id="logoutBtn" class="ghost small hidden">登出</button>
  </header>
  <div id="errorBar"></div>

  <!-- ===== 视图：设备列表（M1.6） ===== -->
  <div id="listView">
    <div class="toolbar">
      <button id="addDeviceBtn" class="small ghost" type="button">＋ 注册设备</button>
    </div>
    <div class="stats" id="stats"></div>
    <div id="list"><div class="empty">加载中…</div></div>
    <div class="updated" id="updated"></div>
  </div>

  <!-- M7.2.2：手动注册设备模态框 -->
  <div id="addDeviceModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>注册设备</h3>
      <div id="addDeviceError" class="auth-error hidden"></div>
      <form id="addDeviceForm">
        <label class="form-label">App</label>
        <select id="addApp" class="auth-input">
          <option value="com.example.integrating">com.example.integrating</option>
        </select>
        <label class="form-label">设备标识（did）</label>
        <input id="addDid" class="auth-input" placeholder="SDK 生成的 did" required>
        <label class="form-label">设备名称</label>
        <input id="addName" class="auth-input" placeholder="例如：张三的 iPhone" required>
        <div class="modal-actions">
          <button type="button" id="addDeviceCancel" class="ghost">取消</button>
          <button type="submit" class="auth-btn">注册</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== 视图：设备详情 + 请求流（M2.5） ===== -->
  <div id="detailView" class="hidden">
    <!-- M9：无会话历史，只有当前会话（连接/断开按钮在设备头） -->

    <!-- M8.2：两列布局（左=设备卡+规则+请求流，右=详情/编辑，撑满高度） -->
    <div class="detail-grid">
      <div class="col-left">
        <div class="device-card">
          <div class="did" id="dDid"></div>
          <div class="row2">
            <span class="badge idle" id="dStatus"></span>
            <span id="dLastSeen"></span>
            <button id="dToggleSession" class="small"></button>
          </div>
        </div>

        <div class="section-title">Mock 规则 <span class="sub" id="rulesInfo"></span></div>
        <div id="rulesConflict" class="conflict hidden"></div>
        <div id="rulesList"><div class="empty">加载中…</div></div>

        <div class="section-title">请求流 <span class="sub" id="trafficInfo"></span>
          <button id="trafficClearBtn" class="small ghost" title="清空本页历史日志（不影响已创建的 Mock 规则）">清空</button>
        </div>
        <input id="trafficFilter" class="filter-input" placeholder="过滤请求（URL/Method 关键字，仅当前页面，刷新即清空）" />
        <div id="trafficList"><div class="empty">请选择会话查看实时请求。</div></div>
      </div>

      <div class="col-right">
        <div class="section-title">详情</div>
        <div id="ruleDetail" class="hidden"><div class="empty">点击左侧一条规则查看详情。</div></div>
        <div id="trafficDetail"><div class="empty">点击左侧请求或规则查看详情。</div></div>
      </div>
    </div>
  </div>
</div>
<script src="lib/codemirror/lib/codemirror.min.js"></script>
<script src="lib/codemirror/mode/javascript/javascript.min.js"></script>
<script src="lib/codemirror/addon/fold/foldcode.min.js"></script>
<script src="lib/codemirror/addon/fold/foldgutter.min.js"></script>
<script src="lib/codemirror/addon/fold/brace-fold.min.js"></script>
<script src="lib/codemirror/addon/edit/matchbrackets.min.js"></script>
<script src="lib/codemirror/addon/edit/closebrackets.min.js"></script>
<script src="app.js"></script>
</body>
</html>
