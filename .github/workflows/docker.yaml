name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Fetch dashboard dist
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p pkg/admin/dashboard/dist
          # Try matching mockd tag first, then fall back to latest stable release.
          if gh release download "$TAG" --repo getmockd/mockd-desktop \
            --pattern 'dashboard-dist.tar.gz' \
            --dir /tmp/dashboard 2>/dev/null \
          || gh release download --repo getmockd/mockd-desktop \
            --pattern 'dashboard-dist.tar.gz' \
            --dir /tmp/dashboard 2>/dev/null; then
            tar -xzf /tmp/dashboard/dashboard-dist.tar.gz -C pkg/admin/dashboard/dist/
            echo "Dashboard dist installed from mockd-desktop:"
            ls -la pkg/admin/dashboard/dist/
          else
            # Upstream release unavailable: write a placeholder so the
            # //go:embed all:dashboard/dist pattern matches and the image
            # still builds without the embedded UI.
            printf '%s\n' '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>MockNetPack Dashboard</title></head><body><h1>MockNetPack Dashboard</h1><p>Dashboard 前端资源未随本构建打包（building without embedded UI）。</p></body></html>' > pkg/admin/dashboard/dist/index.html
            echo "::warning::Dashboard dist not found — building without embedded UI"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
